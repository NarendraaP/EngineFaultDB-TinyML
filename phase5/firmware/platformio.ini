; Phase 5.1 — Microcontroller Build Configuration (PlatformIO)
; Configured for ESP32-S3, RP2040 (Raspberry Pi Pico), and STM32F4 Target Boards

[platformio]
default_envs = esp32s3_devkit

[env:esp32s3_devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -O3
    -DCONFIG_TFLM_OPTIMIZED_KERNELS
    -Iinclude

[env:pico_rp2040]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
build_flags =
    -O3
    -Iinclude

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
monitor_speed = 115200
build_flags =
    -O3
    -Iinclude
